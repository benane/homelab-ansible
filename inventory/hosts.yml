---
# =============================================================================
# 1. KONKRETE HOST-GRUPPEN (Physikalische Hardware & Virtuelle Maschinen)
# =============================================================================

proxmox_nodes:
  hosts:
    pve-node01:
      ansible_host: 172.16.10.10
      system_hostname: "Alderaan"
    pve-node02:
      ansible_host: 172.16.10.50
      system_hostname: "Corellia"

storage_nodes:
  hosts:
    unraid-nas:
      ansible_host: 172.16.10.20
      system_hostname: "Coruscant"

single_board_computers:
  hosts:
    rpi-dns:
      ansible_host: 172.16.10.40
      system_hostname: "Hoth"
    rpi-klipper:
      ansible_host: 172.16.50.30
      system_hostname: "Kamino"

thin_clients:
  hosts:
    wyse-3040:
      ansible_host: 172.16.10.60
      system_hostname: "Mustafar"

# Proxmox VMs (QEMU)
qemu_vms:
  hosts:
    vm-hassio:
      ansible_host: 172.16.10.11

# Proxmox Container (LXC)
lxc_containers:
  hosts:
    lxc-mosquitto:
      ansible_host: 172.16.10.201
    lxc-ollama:
      ansible_host: 172.16.10.202
    lxc-pihole:
      ansible_host: 172.16.10.203
    lxc-uptimekuma:
      ansible_host: 172.16.10.204
    lxc-vaultwarden:
      ansible_host: 172.16.10.205
    lxc-zigbee2mqtt:
      ansible_host: 172.16.10.206
    lxc-paperless:
      ansible_host: 172.16.10.207
    lxc-nginx-proxy:
      ansible_host: 172.16.10.208
    lxc-victoriametrics:
      ansible_host: 172.16.10.209
    lxc-grafana:
      ansible_host: 172.16.10.210
    lxc-wattwarriors:
      ansible_host: 172.16.10.211
    lxc-cloudflared:
      ansible_host: 172.16.10.212
    lxc-authentik:
      ansible_host: 172.16.10.213

# =============================================================================
# 2. LOGISCHE OBERGRUPPEN (Verknüpfen Gruppen über 'children')
# =============================================================================

# Fasst alle echten, physischen Server zusammen:
bare_metal:
  children:
    proxmox_nodes:
    storage_nodes:
    single_board_computers:
    thin_clients:

# Fasst alle virtuellen Instanzen auf Proxmox zusammen:
virtual_machines:
  children:
    qemu_vms:
    lxc_containers:

# =============================================================================
# 3. FUNKTIONALE LOGIK-GRUPPEN (Welches Gerät macht was?)
# =============================================================================

docker_hosts:
  hosts:
    unraid-nas:
    wyse-3040:

pve_qdevice:
  hosts:
    wyse-3040:
