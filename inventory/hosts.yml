---
# =============================================================================
# 1. KONKRETE HOST-GRUPPEN (Physikalische Hardware & Virtuelle Maschinen)
# =============================================================================

proxmox_nodes:
  hosts:
    pve-node01:
      ansible_host: 172.16.10.10
      system_hostname: "Alderaan"
    pve-node02:
      ansible_host: 172.16.10.50
      system_hostname: "Corellia"

storage_nodes:
  hosts:
    unraid-nas:
      ansible_host: 172.16.10.20
      system_hostname: "Coruscant"

single_board_computers:
  hosts:
    rpi-dns:
      ansible_host: 172.16.10.40
      system_hostname: "Hoth"
    rpi-klipper:
      ansible_host: 172.16.50.30
      system_hostname: "Kamino"

thin_clients:
  hosts:
    wyse-3040:
      ansible_host: 172.16.10.60
      system_hostname: "Mustafar"

# Proxmox VMs (QEMU)
qemu_vms:
  hosts:
    vm-hassio:
      ansible_host: 172.16.10.11

# Proxmox Container (LXC)
lxc_containers:
  vars:
    ansible_host: "172.16.10.{{ container_vmid }}"
  hosts:
    lxc-mosquitto:
      container_vmid: 201
      container_node: Corellia
      container_ha: true
      system_hostname: mosquitto
      container_role: mosquitto
      container_tags:
        - smarthome
        - mqtt
    lxc-zigbee2mqtt:
      container_vmid: 202
      container_node: Corellia
      container_ha: true
      system_hostname: zigbee2mqtt-slzb06
      container_role: zigbee2mqtt
      container_tags:
        - smarthome
        - mqtt
    lxc-caddy:
      container_vmid: 204
      system_hostname: caddy
      container_role: caddy
      container_ha: true
      container_node: Corellia
      container_tags:
        - networking
        - reverse-proxy
        - security
    lxc-gatus:
      container_vmid: 206
      system_hostname: gatus
      container_role: gatus
      container_tags:
        - networking
        - monitoring
        - status
    lxc-vaultwarden:
    lxc-paperless:
    lxc-nginx-proxy:
      container_vmid: 208
    lxc-victoriametrics:
      container_vmid: 209
      container_role: victoriametrics
      system_hostname: victoriametrics
      container_tags:
        - database
        - monitoring
    lxc-grafana:
      container_vmid: 210
      container_role: grafana
      system_hostname: grafana
      container_tags:
        - monitoring
        - visualization
    lxc-wattwarriors:
    lxc-cloudflared-a:
      container_vmid: 212
      system_hostname: cloudflared-a
      container_role: cloudflared
      container_node: Alderaan
      container_tags:
        - networking
        - tunnel
        - security
    lxc-authentik:
    lxc-cloudflared-b:
      container_vmid: 214
      system_hostname: cloudflared-b
      container_role: cloudflared
      container_node: Corellia
      container_tags:
        - networking
        - tunnel
        - security

unifi_controllers:
  hosts:
    unifi-controller:
      ansible_host: 172.16.0.1 #oder besser 172.16.10.1?
      ansible_connection: local

unifi_hardware:
  hosts:
    usw-switch-office:
      ansible_host: 172.16.0.10
      system_hostname: "tbd"
    usw-switch-hallway:
      ansible_host: 172.16.0.20
      system_hostname: "tbd"
    usw-switch-media:
      ansible_host: 172.16.0.30
      system_hostname: "tbd"
    ap-u6-lr:
      ansible_host: 172.16.0.40
      system_hostname: "Jedha"

# =============================================================================
# 2. LOGISCHE OBERGRUPPEN (Verknüpfen Gruppen über 'children')
# =============================================================================

# Fasst alle echten, physischen Server zusammen:
bare_metal:
  children:
    proxmox_nodes:
    storage_nodes:
    single_board_computers:
    thin_clients:

# Fasst alle virtuellen Instanzen auf Proxmox zusammen:
virtual_machines:
  children:
    qemu_vms:
    lxc_containers:

debian_machines:
  children:
      proxmox_nodes:
      lxc_containers:
  hosts:
    wyse-3040:
    rpi-dns:
    rpi-klipper:

emmc_hosts:
  hosts:
    wyse-3040:
    rpi-dns:

# Fasst alle echten Netzwerkgeräte zusammen:
network_devices:
  children:
    unifi_controllers:
    unifi_hardware:

# =============================================================================
# 3. FUNKTIONALE LOGIK-GRUPPEN (Welches Gerät macht was?)
# =============================================================================

control_node:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

docker_hosts:
  hosts:
    unraid-nas:

pve_qdevice:
  hosts:
    wyse-3040:

dns_resolvers:
  hosts:
    rpi-dns:
    wyse-3040:

gatus_hosts:
  hosts:
    wyse-3040:
    lxc-gatus:

caddy_hosts:
  hosts:
    lxc-caddy:

crowdsec_hosts:
  hosts:
    lxc-caddy:

cloudflared_hosts:
  hosts:
    lxc-cloudflared-a:
    lxc-cloudflared-b:

monitoring_targets:
  children:
    proxmox_nodes:
    single_board_computers:
    thin_clients:
    # qemu_vms: vm-hassio ist HAOS-Appliance, kein Debian mit node_exporter via SSH+apt.
    # HA-Metriken laufen über HAs eigene Prometheus-Integration (bearer_token-Scrape-Job),
    # nicht über diese Rolle. Erst wieder rein, wenn ein echter node_exporter-fähiger QEMU-Gast dazukommt.

failsafe_hosts:
  hosts:
    wyse-3040:

# Ansible Migration Progress

lxc_provisioned:
  hosts:
    lxc-mosquitto:
    lxc-zigbee2mqtt:
    lxc-gatus:
    lxc-cloudflared-a:
    lxc-cloudflared-b:
    lxc-victoriametrics:
    lxc-grafana:
    lxc-caddy:
