---
# container_site.yml — kompletter Lifecycle für einen neuen LXC-Container.
# 1. Container per Proxmox-API anlegen (containers/bootstrap.yml)
# 2. Warten, bis er per SSH erreichbar ist
# 3. Grundkonfiguration + Hardening anwenden (gleiche Rollen wie site.yml)
# 4. Service-Rolle anwenden, die in hostvars[target_host].container_role definiert ist
#
# Aufruf: ansible-playbook playbooks/container_site.yml -e target_host=lxc-zigbee2mqtt

- import_playbook: containers/bootstrap.yml   # hosts: localhost (Proxmox-API)

- name: Warten, bis SSH erreichbar ist
  hosts: "{{ target_host }}"
  gather_facts: false
  vars:
    ansible_user: root
  tasks:
    - ansible.builtin.wait_for_connection:
        timeout: 60

- name: Container einrichten
  hosts: "{{ target_host }}"
  become: true
  vars:
    ansible_user: root
  roles:
    - common
    - hardening
  tasks:
    - name: Service-Rolle anwenden
      ansible.builtin.include_role:
        name: "{{ hostvars[target_host].container_role }}"