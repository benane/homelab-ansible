---
- hosts: localhost
  gather_facts: false
  become: false
  module_defaults:
    community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ vault_proxmox_api_token_secret }}"
      validate_certs: false

  tasks:
    - name: Container erstellen
      community.proxmox.proxmox:
        node: Alderaan
        vmid: 202
        hostname: zigbee2mqtt-slzb06
        ostemplate: 'local:vztmpl/debian-13-standard_13.1-2_amd64.tar.zst'
        cmode: console
        pool: ansible-automation
        disk: 'local-lvm:4'
        cores: 1
        memory: 512
        netif:
          net0: "name=eth0,bridge=vmbr0,ip=172.16.10.202/24,gw=172.16.10.1"
        pubkey: "{{ lookup('file', proxmox_ansible_pubkey_path) }}"
      register: result

    - name: Container starten
      community.proxmox.proxmox:
        vmid: 202
        state: started

    - name: Ergebnis ausgeben
      ansible.builtin.debug:
        var: result