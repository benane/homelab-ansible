---
- hosts: localhost
  gather_facts: false
  become: false
  vars:
    ct: "{{ hostvars[target_host] }}"
    ct_vmid: "{{ ct.container_vmid }}"
    ct_node: "{{ ct.container_node | default(proxmox_default_node) }}"
    ct_ip: "{{ ct.ansible_host }}"
    ct_mac: "{{ ct.container_mac | default(proxmox_default_mac_prefix + ('%02X' | format(ct_vmid | int))) }}"
    ct_disk: "{{ ct.container_disk | default(proxmox_default_disk) }}"
    ct_cores: "{{ ct.container_cores | default(proxmox_default_cores) }}"
    ct_memory: "{{ ct.container_memory | default(proxmox_default_memory) }}"
    ct_template: "{{ ct.container_ostemplate | default(proxmox_default_template) }}"
    container_default_tags:
      - ansible
  module_defaults:
    community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ vault_proxmox_api_token_secret }}"
      validate_certs: false

  tasks:
    - name: Container erstellen
      community.proxmox.proxmox:
        node: "{{ ct_node }}"
        vmid: "{{ ct_vmid }}"
        hostname: "{{ ct.system_hostname | default(target_host) }}"
        ostemplate: "{{ ct_template }}"
        cmode: console
        pool: "{{ proxmox_default_pool }}"
        disk: "local-lvm:{{ ct_disk }}"
        cores: "{{ ct_cores }}"
        memory: "{{ ct_memory }}"
        netif:
          net0: "name=eth0,bridge=vmbr0,ip={{ ct_ip }}/24,gw={{ proxmox_default_gateway }},hwaddr={{ ct_mac }}"
        pubkey: "{{ lookup('file', proxmox_ansible_pubkey_path) }}"
        tags: >-
          {{ container_default_tags
            + ([ct.container_role] if 'container_role' in ct else [])
            + (ct.container_tags | default([])) }}
        onboot: true

    - name: Container starten
      community.proxmox.proxmox:
        vmid: "{{ ct_vmid }}"
        state: started
