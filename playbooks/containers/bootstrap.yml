---
- hosts: localhost
  gather_facts: false
  become: false
  module_defaults:
    community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ vault_proxmox_api_token_secret }}"
      validate_certs: false

  tasks:
    - name: Container erstellen
      community.proxmox.proxmox:
        node: "{{ hostvars[target_host].container_node | default(proxmox_default_node) }}"
        vmid: "{{ hostvars[target_host].container_vmid }}"
        hostname: "{{ target_host }}"
        ostemplate: "{{  hostvars[target_host].container_ostemplate | default(proxmox_default_template) }}"
        cmode: console
        pool: "{{ proxmox_default_pool }}"
        disk: "local-lvm:{{ hostvars[target_host].container_disk | default(proxmox_default_disk) }}"
        cores: "{{ hostvars[target_host].container_cores | default(proxmox_default_cores) }}"
        memory: "{{ hostvars[target_host].container_memory | default(proxmox_default_memory) }}"
        netif:
          net0: "name=eth0,bridge=vmbr0,ip={{ hostvars[target_host].ansible_host }}/24,gw={{ proxmox_default_gateway }},hwaddr={{ hostvars[target_host].container_mac }}"
        pubkey: "{{ lookup('file', proxmox_ansible_pubkey_path) }}"
        onboot: true
      register: result

    - name: Container starten
      community.proxmox.proxmox:
        vmid: "{{ hostvars[target_host].container_vmid }}"
        state: started
