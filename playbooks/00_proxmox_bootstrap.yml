---
- name: Proxmox VE Post-Install Grundkonfiguration
  hosts: proxmox_nodes
  gather_facts: true
  become: true

  tasks:
    - name: Enterprise-Repository deaktivieren
      ansible.builtin.apt_repository:
        repo: "deb https://enterprise.proxmox.com/debian/pve {{ ansible_distribution_release }} pve-enterprise"
        state: absent
        filename: pve-enterprise
        
    - name: No-Subscription Repository hinzufügen
      ansible.builtin.apt_repository:
        repo: "deb http://download.proxmox.com/debian/pve {{ ansible_distribution_release }} pve-no-subscription"
        state: present
        filename: pve-no-subscription
        
    - name: Ceph Enterprise Repository deaktivieren (falls vorhanden)
      ansible.builtin.apt_repository:
        repo: "deb https://enterprise.proxmox.com/debian/ceph-quincy {{ ansible_distribution_release }} enterprise"
        state: absent
        filename: ceph Enterprise

    - name: APT-Paketlisten aktualisieren und System updaten
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        autoremove: true
        clean: true

    - name: Subscription-Nag-Banner im Web-UI entfernen
      ansible.builtin.replace:
        path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
        regexp: 'NotFound'
        replace: 'Active'
        backup: true
      notify: Restart PVE Proxy

  handlers:
    - name: Restart PVE Proxy
      ansible.builtin.service:
        name: pveproxy
        state: restarted
