- name: Test Proxmox API Verbindung
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Container-Liste abfragen (read-only)
      community.proxmox.proxmox_vm_info:
        api_host: 172.16.10.10
        api_user: ansible@pve
        api_token_id: ansible-automation
        api_token_secret: "{{ vault_proxmox_api_token_secret }}"
        type: lxc
      register: result

    - name: Ergebnis ausgeben
      ansible.builtin.debug:
        var: result