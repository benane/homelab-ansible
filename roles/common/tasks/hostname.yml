---
# /etc/hosts: der eigene Hostname MUSS auf die echte Management-IP auflösen,
# nicht auf 127.0.0.1 / 127.0.1.1 – sonst bricht der PVE-Cluster-Join.
# Eine bereits korrekte Zeile (auch mit FQDN) wird dabei NICHT angefasst.

- name: Auflösung des eigenen Hostnamens prüfen
  ansible.builtin.command: getent hosts {{ system_hostname | default(inventory_hostname) }}
  register: host_resolution
  changed_when: false
  failed_when: false

- name: Loopback-Zeile mit dem eigenen Hostnamen entfernen
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.[01]\.1\s+.*\b{{ (system_hostname | default(inventory_hostname)) | regex_escape }}\b'
    state: absent
  when: host_resolution.stdout.startswith('127.')

- name: Hostname -> echte IP eintragen (nur wenn er fehlt oder auf Loopback zeigt)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ ansible_facts['default_ipv4']['address'] }} {{ system_hostname | default(inventory_hostname) }}"
    state: present
  when: host_resolution.rc != 0 or host_resolution.stdout.startswith('127.')

- name: System-Hostnamen setzen
  ansible.builtin.hostname:
    name: "{{ system_hostname | default(inventory_hostname) }}"
