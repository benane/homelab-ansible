---
- name: unpoller-Repo eintragen
  ansible.builtin.deb822_repository:
    name: unpoller
    types: deb
    uris: "https://packagecloud.io/golift/pkgs/ubuntu"
    suites: focal
    components: main
    signed_by: "https://packagecloud.io/golift/pkgs/gpgkey"
  register: unpoller_repo

- name: APT-Cache aktualisieren
  ansible.builtin.apt:
    update_cache: true
  when: unpoller_repo.changed

- name: unpoller installieren
  ansible.builtin.apt:
    name:
      - unpoller
    state: present
    