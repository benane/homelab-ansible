---
- name: Gruppe anlegen
  ansible.builtin.group:
    name: "{{ vaultwarden_user }}"
    state: present

- name: Service-User anlegen
  ansible.builtin.user:
    name: "{{ vaultwarden_user }}"
    group: "{{ vaultwarden_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
