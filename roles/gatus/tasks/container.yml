---
- name: Podman installieren
  ansible.builtin.apt:
    name: podman
    state: present
    update_cache: true

- name: Konfigurationsverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ gatus_config_dir }}"
    state: directory
    mode: "0755"

- name: secrets.env ausrollen
  ansible.builtin.template:
    src: secrets.env.j2
    dest: "{{ gatus_config_dir }}/secrets.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Gatus-Konfiguration schreiben
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ gatus_config_dir }}/config.yaml"
    mode: "0644"
  notify: gatus neu starten
  tags: [gatus-config]

- name: Quadlet-Unit schreiben
  ansible.builtin.template:
    src: gatus.container.j2
    dest: /etc/containers/systemd/gatus.container
    mode: "0644"
  notify: gatus neu starten
  tags: [gatus-quadlet]
  
- name: systemd neu einlesen (Quadlet -> Unit generieren)
  ansible.builtin.systemd:
    daemon_reload: true

- name: Gatus aktivieren und starten
  ansible.builtin.systemd:
    name: gatus.service
    state: started
    enabled: true
