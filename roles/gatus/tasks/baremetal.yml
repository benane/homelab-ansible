---
- name: Gruppe 'gatus' anlegen
  ansible.builtin.group:
    name: "{{ gatus_user }}"
    state: present

- name: Service-User 'gatus' anlegen
  ansible.builtin.user:
    name: "{{ gatus_user }}"
    group: "{{ gatus_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Konfigurationsverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ gatus_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Datenverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ gatus_data_dir }}"
    state: directory
    owner: "{{ gatus_user }}"
    group: "{{ gatus_user }}"
    mode: "0755"
  when: gatus_storage_type == 'sqlite'

- name: Gatus-Binary installieren
  ansible.builtin.copy:
    src: "gatus-{{ gatus_version }}-{{ gatus_binary_architecture }}"
    dest: /usr/local/bin/gatus
    mode: "0755"
    owner: "{{ gatus_user }}"
    group: "{{ gatus_user }}"
  notify: gatus neu starten

- name: secrets.env ausrollen
  ansible.builtin.template:
    src: secrets.env.j2
    dest: "{{ gatus_config_dir }}/secrets.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Gatus-Konfiguration schreiben
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ gatus_config_dir }}/config.yaml"
    mode: "0644"
  notify: gatus neu starten
  tags: [gatus-config]

- name: Service schreiben
  ansible.builtin.template:
    src: gatus.service.j2
    dest: /etc/systemd/system/gatus.service
    mode: "0644"
  notify: gatus neu starten

- name: Gatus aktivieren und starten
  ansible.builtin.systemd:
    name: gatus.service
    state: started
    enabled: true
    daemon_reload: true
