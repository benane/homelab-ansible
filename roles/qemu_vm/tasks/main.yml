---
- name: QEMU Guest Agent installieren
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
    update_cache: true

- name: QEMU Guest Agent Service starten und aktivieren
  ansible.builtin.systemd:
    name: qemu-guest-agent
    state: started
    enabled: true

- name: Wöchentlichen fstrim Timer für SSD-Performance aktivieren
  ansible.builtin.systemd:
    name: fstrim.timer
    state: started
    enabled: true
