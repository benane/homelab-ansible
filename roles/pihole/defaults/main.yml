---
pihole_image: "docker.io/pihole/pihole:2026.07.2"   # Tag pinnen, nicht latest
pihole_data_dir: /var/lib/pihole
pihole_max_db_days: 30
pihole_ntp_enabled: false

pihole_registry_hosts: >-
  {{ service_registry
     | selectattr('exposure', 'ne', 'none')
     | map(attribute='name')
     | map('regex_replace', '^(.*)$', hostvars['lxc-caddy'].ansible_host ~ ' \1.' ~ external_domain)
     | list }}

pihole_dns_records: "{{ pihole_dns_hosts + pihole_registry_hosts }}"
