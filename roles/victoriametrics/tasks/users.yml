---
- name: Gruppe 'victoriametrics' anlegen
  ansible.builtin.group:
    name: "{{ victoria_user }}"
    state: present

- name: Service-User 'victoriametrics' anlegen
  ansible.builtin.user:
    name: "{{ victoria_user }}"
    group: "{{ victoria_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    