---
- name: Datenverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ victoria_data_dir }}"
    state: directory
    owner: "{{ victoria_user }}"
    group: "{{ victoria_user }}"
    mode: "0755"

- name: Configverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ victoria_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Downloadverzeichnis anlegen
  ansible.builtin.file:
    path: /tmp/victoriametrics
    state: directory
    owner: root
    group: root
    mode: "0755"
