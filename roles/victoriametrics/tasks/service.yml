---
- name: Service schreiben
  ansible.builtin.template:
    src: victoriametrics.service.j2
    dest: /etc/systemd/system/victoriametrics.service
    mode: "0644"
  notify: victoriametrics neu starten

- name: Victoriametrics aktivieren und starten
  ansible.builtin.systemd:
    name: victoriametrics.service
    state: started
    enabled: true
    daemon_reload: true