---
- name: Cloudflare-Repo eintragen
  ansible.builtin.deb822_repository:
    name: cloudflared
    types: deb
    uris: "https://pkg.cloudflare.com/cloudflared"
    suites: any
    components: main
    signed_by: "https://pkg.cloudflare.com/cloudflare-main.gpg"
  register: cloudflared_repo

- name: APT-Cache aktualisieren
  ansible.builtin.apt:
    update_cache: true
  when: cloudflared_repo.changed

- name: cloudflared installieren
  ansible.builtin.apt:
    name:
      - cloudflared
    state: present

- name: Konfigurationsverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ cloudflared_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Credentials-JSON schreiben
  ansible.builtin.copy:
    content: "{{ vault_cloudflared_credentials_json }}"
    dest: "{{ cloudflared_credentials_file }}"
    mode: "0600"
  notify: cloudflared neu starten
  no_log: true

- name: Konfiguration schreiben
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ cloudflared_config_dir }}/config.yml"
    mode: "0644"
  notify: cloudflared neu starten
  tags: [cloudflared-config]

- name: cloudflared als Service registrieren
  ansible.builtin.command:
    cmd: "cloudflared service install"
    creates: /etc/systemd/system/cloudflared.service
