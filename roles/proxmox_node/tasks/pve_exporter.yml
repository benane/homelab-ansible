- name: venv-Python testen
  ansible.builtin.command: "{{ pve_exporter_venv }}/bin/python -c 'import pve_exporter'"
  register: pve_exp_check
  changed_when: false
  failed_when: false

- name: kaputtes venv wegwerfen
  ansible.builtin.file: { path: "{{ pve_exporter_venv }}", state: absent }
  when: pve_exp_check.rc != 0

- name: pve-exporter im venv
  ansible.builtin.pip:
    name: prometheus-pve-exporter
    virtualenv: "{{ pve_exporter_venv }}"
    virtualenv_command: python3 -m venv
  notify: restart pve-exporter

# + template für /etc/prometheus/pve.yml (API-Token aus dem Vault)
# + template für /etc/systemd/system/pve-exporter.service
# + systemd: name=pve-exporter enabled=true state=started daemon_reload=true
