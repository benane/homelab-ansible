---
- name: Gruppe anlegen
  ansible.builtin.group:
    name: "{{ pve_exporter_user }}"
    state: present

- name: Service-User anlegen
  ansible.builtin.user:
    name: "{{ pve_exporter_user }}"
    group: "{{ pve_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: venv-Python testen
  ansible.builtin.command: "{{ pve_exporter_venv }}/bin/python -c 'import pve_exporter'"
  register: pve_exp_check
  changed_when: false
  failed_when: false

- name: kaputtes venv wegwerfen
  ansible.builtin.file: { path: "{{ pve_exporter_venv }}", state: absent }
  when: pve_exp_check.rc != 0

- name: pve-exporter im venv
  ansible.builtin.pip:
    name: prometheus-pve-exporter
    virtualenv: "{{ pve_exporter_venv }}"
    virtualenv_command: python3 -m venv
  notify: restart pve-exporter

- name: Konfigverzeichnis anlegen
  ansible.builtin.file:
    path: /etc/prometheus
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Konfig schreiben
  ansible.builtin.template:
    src: pve.yml.j2
    dest: /etc/prometheus/pve.yml
    mode: "0640"
    owner: root
    group: "{{ pve_exporter_user }}"
  notify: restart pve-exporter

- name: Service schreiben
  ansible.builtin.template:
    src: pve-exporter.service.j2
    dest: /etc/systemd/system/pve-exporter.service
    mode: "0644"
  notify: restart pve-exporter

- name: PVE Exporter aktivieren und starten
  ansible.builtin.systemd:
    name: pve-exporter.service
    state: started
    enabled: true
    daemon_reload: true
