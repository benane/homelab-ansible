---
- name: Gruppe 'caddy' anlegen
  ansible.builtin.group:
    name: "{{ caddy_user }}"
    state: present

- name: Service-User 'caddy' anlegen
  ansible.builtin.user:
    name: "{{ caddy_user }}"
    group: "{{ caddy_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ caddy_data_dir }}"

- name: Caddy-Binary installieren
  ansible.builtin.copy:
    src: "caddy-{{ caddy_version }}-{{ caddy_binary_architecture }}"
    dest: /usr/local/bin/caddy
    mode: "0755"
    owner: root
    group: root
  notify: caddy neu starten

- name: Konfigverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ caddy_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Logverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ caddy_log_dir }}"
    state: directory
    owner: "{{ caddy_user }}"
    group: "{{ caddy_user }}"
    mode: "0755"

- name: Caddy Konfig schreiben
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_config_dir }}/Caddyfile"
    mode: "0644"
  notify: caddy neu laden
  tags: [caddy-config]

- name: .env schreiben
  ansible.builtin.template:
    src: secrets.env.j2
    dest: "{{ caddy_config_dir }}/.env"
    mode: "0600"
  notify: caddy neu starten
  tags: [caddy-config]

- name: Service schreiben
  ansible.builtin.template:
    src: caddy.service.j2
    dest: /etc/systemd/system/caddy.service
    mode: "0644"
  notify: caddy neu starten

- name: Caddy aktivieren und starten
  ansible.builtin.systemd:
    name: caddy.service
    state: started
    enabled: true
    daemon_reload: true