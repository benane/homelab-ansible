---
- name: NodeSource-Repo eintragen
  ansible.builtin.deb822_repository:
    name: nodesource
    types: deb
    uris: "https://deb.nodesource.com/node_{{ z2m_node_major_version }}.x"
    suites: nodistro
    components: main
    signed_by: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
  register: node_repo

- name: APT-Cache aktualisieren
  ansible.builtin.apt:
    update_cache: true
  when: node_repo.changed

- name: Node.js installieren
  ansible.builtin.apt:
    name: nodejs
    state: present

- name: Build-Werkzeuge installieren
  ansible.builtin.apt:
    name:
      - make
      - g++
      - gcc
    state: present

- name: zigbee2mqtt-Repo klonen
  ansible.builtin.git:
    repo: https://github.com/Koenkk/zigbee2mqtt.git
    dest: /opt/zigbee2mqtt
    version: "{{ z2m_version }}"
  register: z2m_repo

- name: pnpm installieren
  ansible.builtin.command: npm install -g pnpm
  args:
    creates: /usr/bin/pnpm

- name: Abhängigkeiten installieren
  ansible.builtin.command: pnpm install --frozen-lockfile
  args:
    chdir: /opt/zigbee2mqtt
  when: z2m_repo.changed

- name: Datenverzeichnis anlegen
  ansible.builtin.file:
    path: /opt/zigbee2mqtt/data
    state: directory

- name: Konfiguration einspielen
  ansible.builtin.template:
    src: configuration.yaml.j2
    dest: /opt/zigbee2mqtt/data/configuration.yaml
  notify: zigbee2mqtt neu starten

- name: systemd-Unit einspielen
  ansible.builtin.template:
    src: zigbee2mqtt.service.j2
    dest: /etc/systemd/system/zigbee2mqtt.service
  notify: zigbee2mqtt neu starten

- name: zigbee2mqtt aktivieren
  ansible.builtin.systemd:
    name: zigbee2mqtt
    enabled: true